<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="128" fill="#1d1d1d"/>
  
  <!-- Outer subtle glowing ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffc490" stroke-width="4" stroke-opacity="0.15" />
  
  <!-- Geometric Monogram "Y" -->
  <g fill="#ffc490">
    <!-- Left Stem -->
    <path d="M 130 120 L 195 120 L 256 240 L 191 240 Z" />
    
    <!-- Right Stem -->
    <path d="M 382 120 L 317 120 L 256 240 L 321 240 Z" />
    
    <!-- Vertical Center Stem -->
    <path d="M 226 230 L 286 230 L 286 390 L 226 390 Z" />
  </g>
  
  <!-- Celestial 4-Point Sparkle Star on Top Right -->
  <g transform="translate(350, 140)">
    <path d="M 0 -35 Q 0 0 35 0 Q 0 0 0 35 Q 0 0 -35 0 Q 0 0 0 -35 Z" fill="#ffc490" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>
</svg>
